apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preprocess-python
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cookie579/fin-guard
    targetRevision: HEAD
    path: k8s/helm/preprocess-python
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
