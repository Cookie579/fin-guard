name: Build & Push Ingest Sec Go

on:
  push:
    paths:
      - "ingest-sec-go/**"
      - "Dockerfile.ingest-sec-go"
      - ".github/workflows/ingest-sec-go.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ingest-sec-go
          push: true
          tags: |
            ghcr.io/cookie579/ingest-sec-go:latest
            ghcr.io/cookie579/ingest-sec-go:${{ github.sha }}
            ghcr.io/cookie579/ingest-sec-go:${{ github.ref_name }}
