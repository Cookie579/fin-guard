name: Build & Push Preprocess Python

on:
  push:
    paths:
      - "python/**"
      - "Dockerfile.preprocess-python"
      - ".github/workflows/preprocess-python.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.preprocess-python
          push: true
          tags: |
            ghcr.io/cookie579/preprocess-python:latest
            ghcr.io/cookie579/preprocess-python:${{ github.sha }}
            ghcr.io/cookie579/preprocess-python:${{ github.ref_name }}
