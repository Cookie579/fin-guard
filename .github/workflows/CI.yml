name: Build & Push ESG-Analyzer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Triggers for version tags like v0.1.2
    paths:
      - "python/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - "requirements.txt"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # Allows pushing to GHCR

    steps:
    - name: 🔄 Checkout
      uses: actions/checkout@v4

    - name: 🐳 Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: 🏗️ Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/cookie579/esg-analyzer:latest
          ghcr.io/cookie579/esg-analyzer:${{ github.sha }}
          ghcr.io/cookie579/esg-analyzer:${{ github.ref_name }}

    - name: 🔁 Argo CD sync
      uses: clowdhaus/argo-cd-action@v2.7.1
      with:
        server: ${{ secrets.ARGO_SERVER }}
        username: admin
        password: ${{ secrets.ARGO_PASSWORD }}
        appName: esg-analyzer
        sync: true
