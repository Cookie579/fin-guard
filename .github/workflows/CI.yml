name: Build & Push ESG-Analyzer and Preprocess-Python

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - "python/**"
      - "ingest-sec-go/**"
      - fin-guard/k8s/helm/preprocess-python/**"
      - "Dockerfile"
      - "Dockerfile.preprocess-python"
      - "Dockerfile.ingest-sec-go"
      - ".github/workflows/ci.yml"
      - "requirements.txt"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: 🔄 Checkout
      uses: actions/checkout@v4

    - name: 🐳 Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: 🏗️ Build & push ESG Analyzer image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/cookie579/esg-analyzer:latest
          ghcr.io/cookie579/esg-analyzer:${{ github.sha }}
          ghcr.io/cookie579/esg-analyzer:${{ github.ref_name }}

    - name: 🏗️ Build & push Preprocess-Python image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.preprocess-python
        push: true
        tags: |
          ghcr.io/cookie579/preprocess-python:latest
          ghcr.io/cookie579/preprocess-python:${{ github.sha }}
          ghcr.io/cookie579/preprocess-python:${{ github.ref_name }}
    
    - name: 🏗️ Build & push Ingest-Sec-Go image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.ingest-sec-go
        push: true
        tags: |
          ghcr.io/cookie579/ingest-sec-go:latest
          ghcr.io/cookie579/ingest-sec-go:${{ github.sha }}
          ghcr.io/cookie579/ingest-sec-go:${{ github.ref_name }}

