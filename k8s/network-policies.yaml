---
# ============================================================
# Deny Cross-Environment Traffic (Explicit Deny)
# ============================================================
# These policies explicitly deny traffic between environments

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-environment-ingress
  namespace: finguard
  labels:
    app.kubernetes.io/name: finguard
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Deny from staging
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: name
                operator: NotIn
                values:
                  - finguard-staging
                  - finguard-dev

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-environment-ingress
  namespace: finguard-staging
  labels:
    app.kubernetes.io/name: finguard
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Deny from prod and dev
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: name
                operator: NotIn
                values:
                  - finguard
                  - finguard-dev

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-environment-ingress
  namespace: finguard-dev
  labels:
    app.kubernetes.io/name: finguard
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Deny from prod and staging
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: name
                operator: NotIn
                values:
                  - finguard
                  - finguard-staging
