apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: esg-analyzer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cookie579/fin-guard
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
