apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingest-esg-go
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cookie579/fin-guard
    targetRevision: HEAD
    path: k8s/helm/ingest-esg-go
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
