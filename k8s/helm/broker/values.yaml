image:
  repository: cookie579/rate-broker
  tag: latest
  pullPolicy: Always

redisAddr: "redis:6379"                      # or your ElastiCache primary endpoint
stocktwits:
  host: "stocktwits.p.rapidapi.com"
  ratePerSec: "0.2777778"
  burst: "10"
  maxInflight: "1"

  keysFromSecret:
    name: preprocess-config
    key: rapidapi_keys     
