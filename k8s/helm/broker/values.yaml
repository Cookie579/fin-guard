namespace: default
replicas: 2

image:
  repository: ghcr.io/cookie579/rate-broker
  tag: latest
  pullPolicy: Always

preprocessConfig:
  secretName: preprocess-config
  secretKey: config.json

embeddedRedis:
  enabled: true
  serviceName: redis
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
