apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-broker
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    app: rate-broker
spec:
  replicas: {{ .Values.replicas | default 2 }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rate-broker
  template:
    metadata:
      labels:
        app: rate-broker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}

      containers:
        - name: broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080

          # Broker reads config from /app/config.json (mounted from Secret)
          volumeMounts:
            - name: preprocess-config
              mountPath: /app
              readOnly: true

          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        - name: redis
          image: {{ .Values.sidecarRedis.image | default "redis:7-alpine" | quote }}
          ports:
            - containerPort: {{ .Values.sidecarRedis.port | default 6379 }}
          args: ["--save", "''", "--appendonly", "no"]
          {{- with .Values.sidecarRedis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: preprocess-config
          secret:
            secretName: {{ .Values.preprocessConfig.secretName | default "preprocess-config" }}
            items:
              - key: {{ .Values.preprocessConfig.secretKey | default "config.json" }}
                path: config.json

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
