apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-broker
  namespace: {{ default "default" .Values.namespace }}
  labels:
    app: rate-broker
spec:
  replicas: {{ default 2 .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rate-broker
  template:
    metadata:
      labels:
        app: rate-broker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: broker
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ default "latest" .Values.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: preprocess-config
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        - name: redis
          image: {{ default "redis:7-alpine" (and .Values.sidecarRedis .Values.sidecarRedis.image) | default "redis:7-alpine" | quote }}
          ports:
            - containerPort: {{ default 6379 (and .Values.sidecarRedis .Values.sidecarRedis.port) | default 6379 }}
          args: ["--save", "''", "--appendonly", "no"]
          {{- if and .Values.sidecarRedis .Values.sidecarRedis.resources }}
          resources:
            {{- toYaml .Values.sidecarRedis.resources | nindent 12 }}
          {{- end }}

      volumes:
        - name: preprocess-config
          secret:
            secretName: {{ default "preprocess-config" (and .Values.preprocessConfig .Values.preprocessConfig.secretName) | default "preprocess-config" }}
            items:
              - key: {{ default "config.json" (and .Values.preprocessConfig .Values.preprocessConfig.secretKey) | default "config.json" }}
                path: config.json

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
