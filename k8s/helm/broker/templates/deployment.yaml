apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-broker
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    app: rate-broker
spec:
  replicas: {{ .Values.replicas | default 2 }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rate-broker
  template:
    metadata:
      labels:
        app: rate-broker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}

      {{- /* Resolve broker image whether .Values.image is a string or a map */ -}}
      {{- $img := .Values.image -}}
      {{- $imageFull := "" -}}
      {{- $pull := "IfNotPresent" -}}
      {{- if kindIs "map" $img -}}
        {{- $repo := default "ghcr.io/cookie579/rate-broker" $img.repository -}}
        {{- $tag  := default "latest" $img.tag -}}
        {{- $imageFull = printf "%s:%s" $repo $tag -}}
        {{- $pull = default "IfNotPresent" $img.pullPolicy -}}
      {{- else -}}
        {{- $imageFull = default "ghcr.io/cookie579/rate-broker:latest" $img -}}
      {{- end }}

      {{- $sc := .Values.sidecarRedis | default dict -}}

      containers:
        - name: broker
          image: {{ $imageFull | quote }}
          imagePullPolicy: {{ $pull | quote }}
          ports:
            - name: http
              containerPort: 8080

          # Broker reads config from /app/config.json (mounted from Secret)
          volumeMounts:
            - name: preprocess-config
              mountPath: /app
              readOnly: true

          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        - name: redis
          image: {{ default "redis:7-alpine" $sc.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $sc.imagePullPolicy | quote }}
          ports:
            - containerPort: {{ default 6379 $sc.port }}
          args: ["--save", "''", "--appendonly", "no"]
          {{- with $sc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: preprocess-config
          secret:
            secretName: {{ .Values.preprocessConfig.secretName | default "preprocess-config" }}
            items:
              - key: {{ .Values.preprocessConfig.secretKey | default "config.json" }}
                path: config.json

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
