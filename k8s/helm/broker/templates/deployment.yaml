apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-broker
  namespace: {{ .Values.namespace | default "default" }}
  labels: { app: rate-broker }
spec:
  replicas: {{ .Values.replicas | default 2 }}
  selector:
    matchLabels: { app: rate-broker }
  template:
    metadata:
      labels: { app: rate-broker }
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
      - name: broker
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        ports:
        - name: http
          containerPort: 8080
        # No env at all — broker reads /app/config.json
        volumeMounts:
        - name: preprocess-config
          mountPath: /app
          readOnly: true
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: preprocess-config
        secret:
          secretName: {{ .Values.preprocessConfig.secretName | default "preprocess-config" }}
          items:
          - key: {{ .Values.preprocessConfig.secretKey | default "config.json" }}
            path: config.json
