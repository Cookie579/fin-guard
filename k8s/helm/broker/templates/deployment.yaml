apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-broker
  namespace: {{ default "default" .Values.namespace }}
  labels:
    app: rate-broker
spec:
  replicas: {{ default 2 .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rate-broker
  template:
    metadata:
      labels:
        app: rate-broker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}

      containers:
        - name: broker
          image: "{{ dig "image" "repository" .Values "ghcr.io/cookie579/rate-broker" }}:{{ dig "image" "tag" .Values "latest" }}"
          imagePullPolicy: {{ dig "image" "pullPolicy" .Values "Always" }}
          ports:
            - name: http
              containerPort: 8080

          # Broker reads config from /app/config.json (mounted from Secret)
          volumeMounts:
            - name: preprocess-config
              mountPath: /app
              readOnly: true

          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- with (dig "resources" .Values nil) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        - name: redis
          image: {{ dig "sidecarRedis" "image" .Values "redis:7-alpine" | quote }}
          ports:
            - containerPort: {{ dig "sidecarRedis" "port" .Values 6379 }}
          args: ["--save", "''", "--appendonly", "no"]
          {{- with (dig "sidecarRedis" "resources" .Values nil) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: preprocess-config
          secret:
            secretName: {{ dig "preprocessConfig" "secretName" .Values "preprocess-config" }}
            items:
              - key: {{ dig "preprocessConfig" "secretKey" .Values "config.json" }}
                path: config.json

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
