{{- if .Values.embeddedRedis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.embeddedRedis.serviceName | default "redis" }}
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: {{ .Values.embeddedRedis.port | default 6379 }}
      targetPort: {{ .Values.embeddedRedis.port | default 6379 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.embeddedRedis.image | quote }}
          ports:
            - containerPort: {{ .Values.embeddedRedis.port | default 6379 }}
          args: ["--save", "''", "--appendonly", "no"]
          resources:
{{ toYaml .Values.embeddedRedis.resources | indent 12 }}
{{- end }}
