apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingest-esg-go.fullname" . }}
  labels:
    {{- include "ingest-esg-go.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ingest-esg-go.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ingest-esg-go.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region }}
            - name: OUT_BUCKET
              value: {{ .Values.aws.outputBucket }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
