apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: {{ include "ingest-esg-go.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  # Always emit eks.amazonaws.com/role-arn as a string. If
  # .Values.serviceAccount.roleArn is empty or undefined the default
  # function returns an empty string, preventing ArgoCD from inserting a
  # nil value and breaking manifest generation.
  annotations:
    eks.amazonaws.com/role-arn: {{ default "" .Values.serviceAccount.roleArn | quote }}
{{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end }}
