apiVersion: v1
kind: Service
metadata:
  name: {{ include "ingest-esg-go.fullname" . }}
  labels:
    {{- include "ingest-esg-go.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ingest-esg-go.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
