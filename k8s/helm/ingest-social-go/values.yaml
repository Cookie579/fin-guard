image:
  repository: ghcr.io/cookie579/ingest-social-go   # orchestrator image
  tag: latest                                      # recommend pinning to a version later
  pullPolicy: Always

serviceAccount:
  name: ingest-social-go                           # orchestrator SA (has RBAC)

runner:
  image: ghcr.io/cookie579/ingest-social-go:latest # runner image for Jobs
  serviceAccountName: ingest-social-go             # or a dedicated SA with IRSA
  imagePullSecret: ghcr-creds

aws:
  region: us-east-1

replicaCount: 1


# Mount the same config.json Secret used by ingest-esg-go
extraVolumes:
  - name: config-volume
    secret:
      secretName: preprocess-config

extraVolumeMounts:
  - name: config-volume
    mountPath: /app/config.json
    subPath: config.json
