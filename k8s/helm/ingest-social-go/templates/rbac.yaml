apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingest-social-go-orchestrator
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create","get","list","delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingest-social-go-orchestrator-rb
  namespace: default
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: default
roleRef:
  kind: Role
  name: ingest-social-go-orchestrator
  apiGroup: rbac.authorization.k8s.io
