apiVersion: v1
kind: Service
metadata:
  name: {{ include "ingest-social-go.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ingest-social-go.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "ingest-social-go.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: 8081
      targetPort: 8081