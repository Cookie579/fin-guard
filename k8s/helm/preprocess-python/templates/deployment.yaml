apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preprocess-python.fullname" . }}
  labels:
    app: {{ include "preprocess-python.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "preprocess-python.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "preprocess-python.name" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: preprocess-python
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
