replicaCount: 1

image:
  repository: ghcr.io/cookie579/preprocess-python
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

imagePullSecrets:
  - name: ghcr-creds

serviceAccount:
  name: preprocess-python-sa
  roleArn: arn:aws:iam::084071638445:role/preprocess-irsa-role
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::084071638445:role/preprocess-irsa-role

resources: {}

extraVolumes:
  - name: config-volume
    secret:
      secretName: preprocess-config

extraVolumeMounts:
  - name: config-volume
    mountPath: /app/config.json
    subPath: config.json
