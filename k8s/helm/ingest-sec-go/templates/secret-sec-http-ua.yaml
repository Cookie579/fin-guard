{{- if .Values.secHttpUa.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secHttpUa.name }}
  labels:
    app.kubernetes.io/name: ingest-sec-go
    app.kubernetes.io/component: runner
type: Opaque
stringData:
  {{ .Values.secHttpUa.key }}: {{ .Values.secHttpUa.value | quote }}
{{- end }}
