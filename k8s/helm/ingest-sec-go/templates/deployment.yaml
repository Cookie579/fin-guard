apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-sec-go
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ingest-sec-go
  template:
    metadata:
      labels:
        app: ingest-sec-go
    spec:
      imagePullSecrets:
        - name: ghcr-creds  # Make sure this secret exists in the namespace
      containers:
        - name: ingest-sec-go
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
