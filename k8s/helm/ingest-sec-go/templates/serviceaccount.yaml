apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
{{- /*
Attach image pull secrets to the service account so that the worker
pods created by the orchestrator can pull private images (e.g. from
GHCR). Without this, jobs may fail with ImagePull errors when
RUNNER_IMAGE points to a private repository. The list of pull secrets
comes from values.yaml (imagePullSecrets).
*/ -}}
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 2 }}
{{- end }}
