      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-streams","severity":"critical","class":"no_data","scope":"fin-guard-reference",
         "runbook":"https://runbooks.local/finguard/kinesis-no-data","pd_notify":true}
      Namespace: AWS/Kinesis
      MetricName: IncomingRecords
      Dimensions:
        - Name: StreamName
          Value: !Ref ReferenceStreamName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  #########################################################
  # FIREHOSE — Delivery streams (routes to finguard-streams)
  #########################################################

  FirehoseEventDataFreshnessHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-streams.error.firehose_freshness.event_deliverytos3_datafreshness"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-streams","severity":"error","class":"firehose_freshness","scope":"fin-guard-event-firehose",
         "runbook":"https://runbooks.local/finguard/firehose-datafreshness","pd_notify":true}
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.DataFreshness
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref EventFirehoseName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FirehoseEventThrottledRecords:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-streams.warning.firehose_throttling.event_throttled_records"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-streams","severity":"warning","class":"firehose_throttling","scope":"fin-guard-event-firehose",
         "runbook":"https://runbooks.local/finguard/firehose-throttling","pd_notify":true}
      Namespace: AWS/Firehose
      MetricName: ThrottledRecords
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref EventFirehoseName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FirehoseReferenceDataFreshnessHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-streams.error.firehose_freshness.reference_deliverytos3_datafreshness"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-streams","severity":"error","class":"firehose_freshness","scope":"fin-guard-reference-firehose",
         "runbook":"https://runbooks.local/finguard/firehose-datafreshness","pd_notify":true}
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.DataFreshness
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref ReferenceFirehoseName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FirehoseReferenceThrottledRecords:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-streams.warning.firehose_throttling.reference_throttled_records"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-streams","severity":"warning","class":"firehose_throttling","scope":"fin-guard-reference-firehose",
         "runbook":"https://runbooks.local/finguard/firehose-throttling","pd_notify":true}
      Namespace: AWS/Firehose
      MetricName: ThrottledRecords
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref ReferenceFirehoseName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  AlarmPack:
    Value: "FinGuard alarms deployed (Lambda + DynamoDB + Kinesis + Firehose)"
