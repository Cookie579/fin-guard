         "runbook":"https://runbooks.local/finguard/ddb-system-errors","pd_notify":true}
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions: [{ Name: TableName, Value: "company_cik_map" }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

