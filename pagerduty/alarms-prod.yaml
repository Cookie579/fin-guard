AWSTemplateFormatVersion: "2010-09-09"
Description: FinGuard - CloudWatch alarms routed to PagerDuty via pd-relay (Lambda + DynamoDB + Kinesis + Firehose)

Parameters:
  Env:
    Type: String
    Default: prod

  IndexerLambdaName:
    Type: String
    Default: fin-indexer

  # Kinesis stream names (your previous names)
  EventStreamName:
    Type: String
    Default: fin-guard-stream
  ReferenceStreamName:
    Type: String
    Default: fin-guard-reference

  # Firehose delivery stream names (your previous names)
  EventFirehoseName:
    Type: String
    Default: fin-guard-event-firehose
  ReferenceFirehoseName:
    Type: String
    Default: fin-guard-reference-firehose

Resources:
  #########################################################
  # LAMBDA — fin-indexer (routes to finguard-ingestion)
  #########################################################

  IndexerNoInvocations:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-ingestion.critical.no_data.indexer_no_invocations"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-ingestion","severity":"critical","class":"no_data","scope":"fin-indexer",
         "runbook":"https://runbooks.local/finguard/indexer-no-invocations","pd_notify":true}
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref IndexerLambdaName
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  IndexerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-ingestion.error.ingestion_failure.indexer_errors"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-ingestion","severity":"error","class":"ingestion_failure","scope":"fin-indexer",
         "runbook":"https://runbooks.local/finguard/indexer-errors","pd_notify":true}
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IndexerLambdaName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IndexerThrottles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-ingestion.critical.capacity.indexer_throttles"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-ingestion","severity":"critical","class":"capacity","scope":"fin-indexer",
         "runbook":"https://runbooks.local/finguard/indexer-throttles","pd_notify":true}
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref IndexerLambdaName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  #########################################################
  # DYNAMODB — throttles + system errors (routes to finguard-dataplane)
  #########################################################

  # Helper pattern: each table gets two alarms: ThrottledRequests + SystemErrors

  DdbThrottleCompanyCikMap:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-dataplane.critical.ddb_throttling.company_cik_map"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-dataplane","severity":"critical","class":"ddb_throttling","scope":"company_cik_map",
         "runbook":"https://runbooks.local/finguard/ddb-throttling","pd_notify":true}
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions: [{ Name: TableName, Value: "company_cik_map" }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DdbSystemErrorsCompanyCikMap:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-dataplane.critical.ddb_system_errors.company_cik_map"
      AlarmDescription: !Sub >
