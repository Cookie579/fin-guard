  #########################################################
  # KINESIS — Streams (routes to finguard-streams)
  #########################################################

  # EVENT stream (fin-guard-stream)
  KinesisEventIteratorAgeHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-streams.error.backlog_lag.event_iterator_age"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-streams","severity":"error","class":"backlog_lag","scope":"fin-guard-stream",
         "runbook":"https://runbooks.local/finguard/kinesis-iterator-age","pd_notify":true}
      Namespace: AWS/Kinesis
      MetricName: GetRecords.IteratorAgeMilliseconds
      Dimensions:
        - Name: StreamName
          Value: !Ref EventStreamName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  KinesisEventNoData:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-streams.critical.no_data.event_incoming_records_zero"
