        {"env":"${Env}","pd_service":"finguard-streams","severity":"critical","class":"no_data","scope":"fin-guard-stream",
         "runbook":"https://runbooks.local/finguard/kinesis-no-data","pd_notify":true}
      Namespace: AWS/Kinesis
      MetricName: IncomingRecords
      Dimensions:
        - Name: StreamName
          Value: !Ref EventStreamName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
