  # REFERENCE stream (fin-guard-reference)
  KinesisReferenceIteratorAgeHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Env}.finguard-streams.error.backlog_lag.reference_iterator_age"
      AlarmDescription: !Sub >
        {"env":"${Env}","pd_service":"finguard-streams","severity":"error","class":"backlog_lag","scope":"fin-guard-reference",
         "runbook":"https://runbooks.local/finguard/kinesis-iterator-age","pd_notify":true}
      Namespace: AWS/Kinesis
      MetricName: GetRecords.IteratorAgeMilliseconds
      Dimensions:
        - Name: StreamName
